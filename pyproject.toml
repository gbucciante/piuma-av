[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piuma-av"
version = "0.6.0"
description = "Antivirus leggero e multipiattaforma basato sul motore ClamAV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
dependencies = ["watchdog>=4.0", "psutil>=5.9"]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]
yara = ["yara-python>=4.3"]
yarax = ["yara-x>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
piuma = "piuma.cli:main"

[tool.setuptools]
packages = ["piuma"]
